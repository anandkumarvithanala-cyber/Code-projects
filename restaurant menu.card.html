<html>
    <head>
        <title>My food menu</title>
        <style>
            body {
                font-family:Arial;
                background:white;
                padding:30px;
                text-align:center;
            }
            h1 { color:orange; }
            h1 + p {
                background:white;
                padding:10px 20px;
                border-radius:8px;
                color:orangered;
                display:inline-block;
            }
            ul {padding:0; margin-top:20px;}
            ul>li {
                list-style:none;
                font-size:18px;
                font-weight:bold;
                color:brown;
                padding: 10px 20px;
                margin:6px auto;
                width:260px;
                background:white;
                border-radius:8px;
            }
            ul li:nth-child(3) {
                background:yellow;
                color:orange;
            }
            .desc{
                color:gray;
                margin-top:20px;
                font-size:15px;
                max-width:400px;
                margin-left:auto;
                margin-right:auto;
            }
            .desc::first-letter {
                font-size:220%;
                color:orange;
                font-weight:bold;
            }
            .links{
                margin-top:20px;
            }
            a{
                color:orange;
                text-decoration:none;
                font-size:15px;
                margin:0 10px;
                padding:10px 20px;
                border: 2px solid orange;
                border-radius:8px
            }
            a:hover{
                background:orange;
                color:white;
            }
            </style>
    </head>
    <body>
        <h1>My food menu</h1>
        <p>Pick your favourite dish and dig in!</p>
        <ul>
            <li>pizza</li>
            <li>burger</li>
            <li>Tacos-Chef's special</li>
            <li>noodles</li>
            <li>ice cream</li>
        </ul>
        <p class="desc">Every dish on the menu is made with lots of love and flavour.Try them all and find ur favourite!</p>
        <div class="links">
            <a href="#">Order now</a>
            <a href="#">View more details</a>
        </div>
    </body>
    </html>
