<html>
<head>
<title>My animal fact file</title>
<style>
    body {
        background-color:darkgreen;
        font-family:Arial,sans-serif;
    }
    .fact-file{
        background-color:lightyellow;
        color:darkslategrey;
        width:260px;
        margin:25px;
        padding:20px;
    }
    .animal-name{
        color:forestgreen;
        font-size:22px;
    }
    .detail{
        color:darkslategrey
    }
    .cool-fact{
        color:darkorange;
        font-style:italic;
    }
</style>
</head>
<body>
    <div class="fact-file">
        <h2 class="animal-name">Snow Leopard</h2>
        <p class= "detail">Type: Big cat</p>
        <p class="detail">Lives in:Mountain ranges of central asia</p>
        <p class="detail">Diet: Deer,goats, and wild sheep</p>
        <p class="cool-fact">Cool Fact:Can leap up to 15 metres in 1 jump!</p>
    </body>
    </html>
