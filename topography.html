<html>
    <head>
        <title>Typography</title>
        <style>
            body{
                background-color:darkcyan;
                font-family:"FranklinGothic Medium","Arial Narrow";
                text-align:center;

            }
        h1{
            color:yellow;
            font-weight:bold;
            text-shadow:orange 3px,3px;
            font-size:40px;
        }
        p{
            color:lightskyblue;
            text-transform:capitalize;
            font-size:20px;

        }
        h2{
            color:crimson;
            text-decoration:underline;
            text-transform:capitalize;

        }
        .strike{
            text-decoration:line-through;
        }
        h4{
            color:coral;
            text-transform:capitalize;
            rotate:45deg;
        }
        </style>
        </head>
        <body>
            <h1>Thuder Kid</h1>
            <p>The most powerful hero in the schiool</p>
            <h1>Superpowers</h1>
            <p>can run faster than a cheetah</p>
            <h2>weekness</h2>?
            <div class="strike">
                <p>Maths homework</p>
                <p>brocolli</p>
            </div>
            <h4>Top hero</h4>
        </body>
        </html>
